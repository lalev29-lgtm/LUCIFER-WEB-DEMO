<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LUCIFER-WEB · Мобилна диагностика</title><style>body{font:16px system-ui;background:#101e31;color:#f5f7fb;margin:0;padding:16px}h1{font-size:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d3551;padding:14px;border-radius:8px}button{font:inherit;padding:12px;border-radius:8px}#demo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}#demo span{border:1px solid #6fa0c9;border-radius:4px;padding:10px 2px;text-align:center;font-size:12px;overflow-wrap:anywhere;background:#163b5b}@media(min-width:761px){#demo{grid-template-columns:repeat(8,minmax(0,1fr))}}</style></head><body><h1>LUCIFER-WEB · Диагностика на мобилното оформление</h1><p>Самостоятелна тестова страница. Не променя основния сайт или данните.</p><button id="refresh">Обнови измерванията</button><pre id="out"></pre><h2>Проба: осем бутона</h2><div id="demo"><span>Начало</span><span>За нас</span><span>Услуги</span><span>Бизнес партньори</span><span>Контакти</span><span>Консултация</span><span>Демо</span><span>Вход</span></div><script>function check(){const mq=matchMedia('(max-width:760px)').matches;const d=document.getElementById('demo');const cs=getComputedStyle(d);const data={url:location.href,userAgent:navigator.userAgent,screenWidth:screen.width,screenHeight:screen.height,devicePixelRatio:devicePixelRatio,innerWidth:innerWidth,outerWidth:outerWidth,clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,visualViewportWidth:window.visualViewport?.width,mediaQuery760:mq,gridColumns:cs.gridTemplateColumns,gridDisplay:cs.display,buttons:d.children.length,rows:[...new Set([...d.children].map(x=>Math.round(x.getBoundingClientRect().top)))].length};document.getElementById('out').textContent=JSON.stringify(data,null,2)}document.getElementById('refresh').onclick=check;addEventListener('resize',check);check()</script></body></html>
