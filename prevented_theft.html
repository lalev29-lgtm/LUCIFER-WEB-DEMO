<!doctype html><html lang="bg"><head>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://luciferweb.com/demo/prevented_theft.html"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Предотвратени кражби · LUCIFER-WEB</title><style>body{font:16px system-ui;background:#0b1220;color:#eaf1fc;margin:0;padding:24px}main{max-width:1050px;margin:auto}a{color:#a8d7ff}section{background:#17283e;border:1px solid #395878;border-radius:12px;padding:18px;margin:16px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.cards div{background:#203753;border-radius:9px;padding:16px}strong{display:block;font-size:1.5rem;margin-top:6px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #395878}small{color:#bdcde1}.warning{border-left:4px solid #f6c453;padding:12px;background:#302a1c}</style></head><body><main><p><a href="index.html">← Работна среда</a></p><h1>Предотвратени кражби</h1><p class="warning">Отделна предварителна статистика по LUCIFER 1.0. Не е окончателно одобрена оценка; данните са локални в този браузър.</p><section><div class="cards" id="metrics"></div></section><section><h2>Отделна оценка H / U (Excel: H / V)</h2><div id="assessment"></div></section><section><h2>Проверка на доказателствата</h2><div id="details"></div></section></main><script src="prevented_theft_browser.js"></script><script>"use strict";(function(){const m=document.getElementById("metrics"),a=document.getElementById("assessment"),d=document.getElementById("details");function item(name,value){const x=document.createElement("div"),n=document.createElement("span"),v=document.createElement("strong");n.textContent=name;v.textContent=String(value);x.append(n,v);m.append(x)}try{if(!window.LuciferPreventedTheft)throw Error("Модулът не е зареден");const rows=JSON.parse(localStorage.getItem("lucifer-web-site-001-demo-v1")||"[]");const s=window.LuciferPreventedTheft.preventedTheftStatistics(rows);item("Доказани предотвратени",s.confirmed);item("Непотвърдени опити",s.unconfirmed);item("Известна застрашена стойност V (EUR)",s.threatenedAmount===null?"Неоценена":s.threatenedAmount.toFixed(2));item("Неизвестни V",s.unknownU);item("Невалидни V",s.invalidU);item("Действителни щети P по доказаните (EUR)",s.actualLossKnown.toFixed(2));item("Изключени кражби до проверка",s.pendingTheftRecords);const line=(label,value)=>{const p=document.createElement("p"),b=document.createElement("b");b.textContent=label+": ";p.append(b,document.createTextNode(String(value)));a.append(p)};line("Максимална експертна H",s.expertMax??"Неоценена");line("Средна известна U/V (EUR)",s.meanU===null?"Неизвестна":s.meanU.toFixed(2));line("Финансов индекс (предварителен)",s.financialIndex??"Неоценен");line("Крайна категория (предварителна)",s.finalRisk);line("Статус",s.status);d.textContent="Доказателствата се класифицират по въведения статус и препратка. Самоличност, истинност на файловете и цифрови подписи още не се удостоверяват."; }catch(e){m.textContent="Данните не могат да бъдат прочетени: "+e.message; a.textContent="Оценката е блокирана.";}})();</script></body></html>
